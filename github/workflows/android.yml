name: Build NeonShooter APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Android raylib template
        uses: actions/checkout@v4
        with:
          repository: Bigfoot71/raymob
          submodules: recursive
          path: project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          yes | sdkmanager --licenses

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonShooter-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
